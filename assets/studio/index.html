<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>阿坤 Vibe Studio</title><link rel="stylesheet" href="style.css?v=2"></head><body><main>
<header><div><small>AKUN / VIBE STUDIO</small><h1>把一个选题，做成完整短片</h1><p>编辑分镜、预览音画、录制整片。</p></div><div class="header-actions"><button id="save" class="ghost">保存工程</button><label class="filebutton ghost">打开工程<input id="load" type="file" accept="application/json,.json"></label></div></header>
<section class="layout"><aside><div class="section-head"><h2>项目设置</h2><span>保存在本机</span></div><label>影片标题<input id="title" maxlength="80"></label><div class="twocol"><label>画幅<select id="aspect"><option value="landscape">横屏 16:9</option><option value="portrait">竖屏 9:16</option></select></label><label>音乐起点（秒）<input type="number" id="offset" min="0" max="3600" step="0.1" value="0"></label></div><label>背景音乐<input type="file" id="audio" accept="audio/*,video/mp4"></label><div class="music-info" id="music-info">正在检查本地配乐…</div><label class="check"><input id="loop" type="checkbox"> 音乐不够长时循环</label><div class="section-head scenes-head"><div><h2>分镜</h2><span>按顺序播放，时长自动相加</span></div><button id="add" class="ghost">＋ 添加</button></div><div id="scenes"></div><div class="project-actions"><button id="reset" class="link">载入 AI 选题示例</button></div></aside>
<article><div class="preview-head"><div><small>PREVIEW</small><h2>影片预览</h2></div><span id="duration-label"></span></div><div class="stage"><canvas id="canvas" width="1280" height="720"></canvas></div><div class="transport"><button id="play">▶ 播放</button><span id="clock">00:00 / 00:00</span><input id="seek" type="range" min="0" max="1" value="0" step="0.01" aria-label="播放进度"><button id="export">录制完整视频</button></div><p id="status" role="status">可调整分镜后预览。导出为实时录制的 WebM 视频。</p><p class="note">预览与导出会使用当前分镜和选择的音乐；保存工程只保存文字与设置，不打包音乐文件。</p><div class="evidence"><b>使用提示</b><span>AI 生成内容也可能出错，正式发布前请核实事实及音乐使用权限。长文本请在画面中确认可读。</span></div></article></section></main><script src="app.js?v=satire2"></script><script src="renderer.js?v=satire2"></script></body></html>
